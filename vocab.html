<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語彙 Vocab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23c8102e'/></svg>">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #1f1d1a; --muted: #77716a; --line: #e7e1d8;
    --accent: #c8102e; --accent-soft: #fbe9ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #201f1c; --ink: #eeeae4; --muted: #9a948b; --line: #33302b; --accent-soft: #3a1b20; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 2px 6px; }
  button.link:hover { color: var(--accent); }
  .count { font-size: 15px; color: var(--muted); }
  .count b { font-size: 28px; color: var(--accent); margin-right: 4px; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tools input { margin: 0; flex: 1; min-width: 180px; }
  .decks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .decks button { padding: 3px 12px; border-radius: 999px; font-size: 13px; }
  .decks button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .rows { border-top: 1px solid var(--line); }
  .vrow, .vhead { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(110px, 1.3fr) minmax(0, 2.6fr) minmax(0, 1.6fr); gap: 14px; align-items: baseline; padding: 10px 6px; }
  .vhead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 0; padding-bottom: 6px; }
  .vrow { border-bottom: 1px solid var(--line); cursor: pointer; }
  .vrow:hover { background: var(--bg); }
  .vrow .word { font-size: 19px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; color: var(--ink); }
  .vrow .kana { font-size: 21px; font-weight: 600; overflow-wrap: anywhere; }
  .vrow .ex { font-size: 15px; overflow-wrap: anywhere; }
  mark { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 3px; padding: 0 2px; }
  .vrow .en { font-size: 14px; visibility: hidden; }
  .vrow .en b { display: block; font-weight: 600; }
  .vrow .en span { color: var(--muted); font-size: 13px; }
  .vrow:hover .en { visibility: visible; }
  #d-body { padding: 22px 20px 16px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(440px, calc(100% - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog .x { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 22px; color: var(--muted); padding: 2px 8px; }
  dialog .x:hover { color: var(--accent); }
  .d-word { font-size: 38px; line-height: 1.2; text-align: center; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .d-kana { text-align: center; font-size: 17px; }
  .d-meaning { text-align: center; font-weight: 600; margin: 6px 0 14px; }
  .d-ex { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .d-ex .jp { font-size: 16px; }
  .d-ex .jp.kj { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: 17px; }
  .d-ex .en { color: var(--muted); margin-bottom: 8px; }
  .d-ex .en:last-child { margin-bottom: 0; }
  .d-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .d-kanji { display: flex; flex-wrap: wrap; gap: 8px; }
  .kc { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 8px; padding: 4px 10px; color: inherit; text-decoration: none; background: var(--card); }
  .kc.new { border-style: dashed; border-top: 1px dashed var(--line); }
  .kc:hover { border-color: var(--accent); }
  .kc .c { font-size: 24px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .kc small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .cov-line { font-size: 13px; color: var(--muted); }
  .d-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) {
    .vhead { display: none; }
    .vrow { grid-template-columns: auto 1fr; gap: 2px 12px; }
    .vrow .ex { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
    .vrow .en { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>語彙</span> Vocab</h1>
    <div class="row" style="align-items:center">
      <a href="./">Hours</a>
      <a href="grammar.html">Grammar</a>
      <a href="kanji.html">Kanji</a>
      <button type="button" class="link" id="auth">Sign in</button>
    </div>
  </header>

  <div class="card" id="auth-card" hidden>
    <h2>Sign in to edit</h2>
    <p class="muted" style="margin:0 0 10px;font-size:14px">
      Paste the same GitHub token you use on the hours page. It's stored in this browser only.
    </p>
    <form id="auth-form" class="row">
      <label style="flex:1;min-width:160px">Token <input type="password" id="token" autocomplete="off" required></label>
      <button type="submit" class="primary">Sign in</button>
      <button type="button" id="auth-cancel">Cancel</button>
    </form>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:14px">
      <div>
        <div class="count"><b id="s-total">–</b> words</div>
        <a class="cov-line" id="cov" href="kanji.html" hidden></a>
      </div>
      <span class="muted" style="font-size:13px" id="status">Loading…</span>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search Japanese, English or romaji…" autocomplete="off">
    </div>
    <div class="decks" id="decks"></div>
    <div class="vhead"><span>Kanji</span><span>Kana</span><span>Example</span><span>English <span style="text-transform:none;letter-spacing:0">(hover)</span></span></div>
    <div class="rows" id="list"></div>
  </div>
</main>
<dialog id="detail"><button type="button" class="x" id="d-close" aria-label="Close">×</button><div id="d-body"></div></dialog>
<div class="toast" id="toast"></div>

<script src="github.js?v=20261003b"></script>
<script src="kanji-links.js?v=20261010a"></script>
<script>
const FILE = 'vocab.json';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Forms of a word to look for in its example sentence, longest first — the sentence may be conjugated
function wordForms(v) {
  const forms = [v.word, v.kana];
  for (const f of [v.word, v.kana]) {
    if (!f) continue;
    if (f.endsWith('ます') && f.length >= 4) forms.push(f.slice(0, -2));     // たべます → たべ (たべました, たべに…)
    else if (f.endsWith('い') && f.length >= 3) forms.push(f.slice(0, -1));   // たのしい → たのし (たのしかった)
  }
  // drop one-character stems (い from います would match everywhere)
  return [...new Set(forms.filter(f => f && (f.length >= 2 || f === v.kana)))].sort((a, b) => b.length - a.length);
}
// Example sentence as HTML with the word highlighted
function highlight(sentence, v) {
  const form = wordForms(v).find(f => sentence.includes(f));
  return form ? sentence.split(form).map(esc).join(`<mark>${esc(form)}</mark>`) : esc(sentence);
}

let vocab = [];        // [{ id, word, kana, meaning, examples: [{ jp, en }], deck }]
let token = store.get(TOKEN_KEY);
let deck = 'all';
let kanji = [];        // from kanji.json, to mark which of a word's kanji you know

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

function render() {
  $('s-total').textContent = vocab.length;
  const cov = kanjiCoverage(vocab, kanji);
  $('cov').hidden = !cov.total;
  $('cov').textContent = `Uses ${cov.total} kanji · you know ${cov.known} →`;

  const decks = [...new Set(vocab.map(v => v.deck).filter(Boolean))];
  $('decks').hidden = decks.length < 2;
  $('decks').innerHTML = ['all', ...decks].map(d =>
    `<button type="button" data-deck="${esc(d)}" class="${d === deck ? 'on' : ''}">${d === 'all' ? 'All' : esc(d)}</button>`).join('');

  const q = $('q').value.trim().toLowerCase();
  const shown = vocab.filter(v => (deck === 'all' || v.deck === deck) &&
    matchesQuery(q, [v.word, v.kana, v.meaning]));

  $('list').innerHTML = shown.length ? shown.map(v => {
    const ex = v.examples[0];
    return `
    <div class="vrow" data-id="${esc(v.id)}">
      <span class="word" lang="ja">${esc(v.word) || '—'}</span>
      <span class="kana" lang="ja">${esc(v.kana)}</span>
      <span class="ex" lang="ja">${ex ? highlight(ex.jp, v) : ''}</span>
      <span class="en"><b>${esc(v.meaning)}</b>${ex?.en ? `<span>${esc(ex.en)}</span>` : ''}</span>
    </div>`;
  }).join('')
    : `<div class="empty">${vocab.length ? 'No words match.' : 'No words yet.'}</div>`;
}

$('q').addEventListener('input', render);
$('decks').addEventListener('click', ev => {
  const d = ev.target.dataset.deck;
  if (d) { deck = d; render(); }
});
// Click a box: popup with meaning, example sentences and deck
function showWord(id) {
  const v = vocab.find(x => x.id === id);
  if (!v) return;
  $('d-body').innerHTML = `
    <div class="d-word" lang="ja">${esc(v.word || v.kana)}</div>
    ${v.word ? `<div class="d-kana" lang="ja">${esc(v.kana)}</div>` : ''}
    <div class="d-meaning">${esc(v.meaning)}</div>
    ${kanjiIn(v.word).length ? `<div class="d-h" style="margin-top:0">Kanji in this word</div>
    <div class="d-kanji">${kanjiIn(v.word).map(c => {
      const k = kanji.find(x => x.k === c);
      return `<a class="kc${k ? '' : ' new'}" href="kanji.html#${encodeURIComponent(c)}" title="${k ? 'In your kanji list' : 'Not in your kanji list yet'}">
        <span class="c" lang="ja">${esc(c)}</span>
        <span>${k ? `<small lang="ja">${esc(k.reading)}</small><small>${esc(k.meaning)}</small>` : '<small>not learned yet</small>'}</span></a>`;
    }).join('')}</div>
    <div class="d-h">Example</div>` : ''}
    <div class="d-ex">${v.examples.map(e => `<div class="jp" lang="ja">${highlight(e.jp, v)}</div>${e.kanji ? `<div class="jp kj" lang="ja">${highlight(e.kanji, v)}</div>` : ''}<div class="en">${esc(e.en)}</div>`).join('')
      || '<span class="muted">No example sentence.</span>'}</div>
    <div class="d-meta"><span>${esc(v.deck)}</span>${token ? `<button type="button" class="link" data-del="${esc(v.id)}">remove</button>` : ''}</div>`;
  if (!$('detail').open) $('detail').showModal();
}
$('list').addEventListener('click', ev => {
  const box = ev.target.closest('.vrow');
  if (box) showWord(box.dataset.id);
});
$('d-close').addEventListener('click', () => $('detail').close());
const openFromHash = () => { const id = decodeURIComponent(location.hash.slice(1)); if (id) showWord(id); };
window.addEventListener('hashchange', openFromHash);
$('detail').addEventListener('click', async ev => {
  if (ev.target === $('detail')) return $('detail').close();   // clicked the backdrop
  const del = ev.target.dataset.del;
  if (!del) return;
  const v = vocab.find(x => x.id === del);
  if (v && confirm(`Remove ${v.word || v.kana}?`)) {
    $('detail').close();
    await save(list => list.filter(x => x.id !== del), 'Remove word ' + (v.word || v.kana), 'Removed');
  }
});

async function save(mutate, message, okMsg) {
  if (!token) { toast('Sign in to edit'); return false; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    vocab = await ghWrite(FILE, list => mutate(list) ?? list, message, token, { empty: [] });
    toast(typeof okMsg === 'function' ? okMsg() : okMsg); return true;
  } catch (e) { toast(e.message); return false; }
  finally { document.querySelectorAll('button').forEach(b => b.disabled = false); render(); }
}

// --- Owner sign-in (same token as the hours page) ---
function applyAuth() {
  document.querySelectorAll('.owner-only').forEach(el => el.hidden = !token);
  $('auth').textContent = token ? 'Sign out' : 'Sign in';
  render();
}
$('auth').addEventListener('click', () => {
  if (token) { token = null; store.del(TOKEN_KEY); applyAuth(); toast('Signed out'); }
  else { $('auth-card').hidden = false; $('token').focus(); }
});
$('auth-cancel').addEventListener('click', () => $('auth-card').hidden = true);
$('auth-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const t = $('token').value.trim();
  if (!await ghCanWrite(t)) return toast('That token can\'t write to ' + REPO);
  token = t; store.set(TOKEN_KEY, t);
  $('token').value = ''; $('auth-card').hidden = true;
  applyAuth(); toast('Signed in');
});

applyAuth();
Promise.all([ghRead(FILE, [], token), loadJson('kanji.json')])
  .then(([r, k]) => { vocab = r.data; kanji = k; render(); openFromHash(); $('status').textContent = 'Hover a row for the English, click it for more examples and its kanji.'; })
  .catch(e => { $('status').textContent = 'Couldn\'t load vocab: ' + e.message; });
</script>
</body>
</html>
