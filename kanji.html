<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字 Kanji</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23c8102e'/></svg>">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #1f1d1a; --muted: #77716a; --line: #e7e1d8;
    --accent: #c8102e; --accent-soft: #fbe9ec;
    --great: #2e8b57; --neutral: #b9b0a4; --bad: #c8102e;  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #201f1c; --ink: #eeeae4; --muted: #9a948b; --line: #33302b; --accent-soft: #3a1b20; --great: #4caf7a; --neutral: #5f5a52; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .count { font-size: 15px; color: var(--muted); }
  .count b { font-size: 28px; color: var(--accent); margin-right: 4px; }
  label { display: block; font-size: 13px; color: var(--muted); }
  input, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 2px 6px; }
  button.link:hover { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .kbox { position: relative; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px; padding: 10px 8px; text-align: center; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
  .kbox .k { font-size: 64px; line-height: 1.15; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .kbox .r { font-size: 15px; color: var(--ink); min-height: 1.4em; visibility: hidden; }
  .kbox .m { font-size: 13px; color: var(--muted); min-height: 1.4em; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; visibility: hidden; }
  .kbox { cursor: pointer; }
  .kbox:hover .r, .kbox:hover .m { visibility: visible; }
  .kbox:hover { border-color: var(--accent); }
  .cov-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 14px; }
  .cov-bar div { height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: baseline; gap: 4px; border: 1px dashed var(--line); border-radius: 8px; padding: 4px 10px; background: var(--card); cursor: pointer; font: inherit; color: var(--ink); }
  .chip:hover { border-color: var(--accent); }
  .chip .c { font-size: 22px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .chip small { color: var(--muted); font-size: 11px; }
  #d-body { padding: 22px 20px 16px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(440px, calc(100% - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog .x { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 22px; color: var(--muted); padding: 2px 8px; }
  dialog .x:hover { color: var(--accent); }
  .d-k { font-size: 64px; line-height: 1.15; text-align: center; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .d-r { text-align: center; font-size: 17px; }
  .d-m { text-align: center; font-weight: 600; margin: 4px 0 14px; }
  .d-story { background: var(--bg); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }
  .d-story .parts { font-size: 18px; margin-bottom: 2px; }
  /* Test */
  #test { width: min(480px, calc(100% - 32px)); }
  #t-body { padding: 22px 20px 18px; text-align: center; }
  .t-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
  .t-modes button { padding: 14px 10px; }
  .t-modes b { display: block; font-size: 16px; }
  .t-modes small { color: var(--muted); }
  .t-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .t-bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .t-bar div { height: 100%; width: 100%; background: var(--accent); }
  .t-k { font-size: 120px; line-height: 1.2; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
  .t-ans { min-height: 64px; margin: 4px 0 14px; }
  .t-ans .r { font-size: 20px; }
  .t-ans .m { font-weight: 600; }
  .t-btns { display: flex; gap: 10px; justify-content: center; }
  .t-btns { align-items: center; flex-wrap: wrap; }
  .t-btns > button { min-width: 90px; }
  .t-btns .rate button { min-width: 84px; }
  .t-btns .rate button.now { outline: 2px solid var(--ink); outline-offset: 1px; }
  .t-btns .rate button[data-rate="great"] { border-color: var(--great); color: var(--great); }
  .t-btns .rate button[data-rate="neutral"] { border-color: var(--neutral); color: var(--neutral); }
  .t-btns .rate button[data-rate="bad"] { border-color: var(--bad); color: var(--bad); }
  .d-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .d-words { background: var(--bg); border-radius: 8px; padding: 6px 12px; }
  .d-words a { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .d-words a:last-child { border-bottom: none; }
  .d-words a:hover .dw { color: var(--accent); }
  .d-words .dw { font-size: 18px; }
  .d-words .dk { font-size: 13px; }
  .d-words .dm { font-size: 13px; color: var(--muted); margin-left: auto; text-align: right; }
  .d-meta { display: flex; justify-content: flex-end; margin-top: 12px; }
  .kbox .rm:hover { color: var(--accent); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; grid-column: 1 / -1; }
  .search { margin: 0 0 10px; }
  .kbox.great { border-top-color: var(--great); }
  .kbox.neutral { border-top-color: var(--neutral); }
  .kbox.bad { border-top-color: var(--bad); }
  .levels { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .levels button { padding: 3px 12px; border-radius: 999px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .levels button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .levels .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .rate button { padding: 8px 6px; font-weight: 600; border-width: 2px; }
  .rate button[data-level="great"].on { background: var(--great); border-color: var(--great); color: #fff; }
  .rate button[data-level="neutral"].on { background: var(--neutral); border-color: var(--neutral); color: #fff; }
  .rate button[data-level="bad"].on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .lvl-tag { display: block; text-align: center; font-size: 12px; font-weight: 600; margin: -8px 0 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .kbox .k { font-size: 48px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>漢字</span> Kanji</h1>
    <div class="row" style="align-items:center">
      <a href="./">Hours</a>
      <a href="grammar.html">Grammar</a>
      <a href="vocab.html">Vocab</a>
      <button type="button" class="link" id="auth">Sign in</button>
    </div>
  </header>

  <div class="card" id="auth-card" hidden>
    <h2>Sign in to edit</h2>
    <p class="muted" style="margin:0 0 10px;font-size:14px">
      Paste the same GitHub token you use on the hours page. It's stored in this browser only.
    </p>
    <form id="auth-form" class="row">
      <label style="flex:1;min-width:160px">Token <input type="password" id="token" autocomplete="off" required></label>
      <button type="submit" class="primary">Sign in</button>
      <button type="button" id="auth-cancel">Cancel</button>
    </form>
  </div>

  <div class="card" id="cov-card" hidden>
    <h2>From your vocab</h2>
    <div id="cov"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:14px">
      <div class="count"><b id="s-total">–</b> kanji</div>
      <span class="muted" style="font-size:13px" id="status">Loading…</span>
      <button type="button" class="primary" id="test-open">Test yourself</button>
    </div>
    <input type="search" id="q" class="search" placeholder="Search kanji, reading or meaning… (romaji works too)" autocomplete="off">
    <div class="levels" id="levels"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<dialog id="detail"><button type="button" class="x" id="d-close" aria-label="Close">×</button><div id="d-body"></div></dialog>
<dialog id="test"><button type="button" class="x" id="t-close" aria-label="Close">×</button><div id="t-body"></div></dialog>
<div class="toast" id="toast"></div>

<script src="github.js?v=20261003b"></script>
<script src="kanji-links.js?v=20261010a"></script>
<script>
const FILE = 'kanji.json';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let kanji = [];        // [{ k, reading, meaning, parts?, story?, added: 'YYYY-MM-DD', id? (Anki note id) }]
let vocab = [];        // from vocab.json, for "used in your vocab"
let token = store.get(TOKEN_KEY);
let levelFilter = 'all';

// How well you know each kanji. Unrated counts as neutral.
const LEVELS = [
  { id: 'great', name: 'Great' },
  { id: 'neutral', name: 'Neutral' },
  { id: 'bad', name: 'Bad' },
];
const levelOf = x => x.level || 'neutral';

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}

// The kanji the grid is showing right now (level filter + search)
const visibleKanji = () => kanji.filter(x => (levelFilter === 'all' || levelOf(x) === levelFilter) && matchesQuery($('q').value, [x.k, x.reading, x.meaning, x.parts, x.story]));

function render() {
  $('s-total').textContent = kanji.length;
  const q = $('q').value;
  const counts = Object.fromEntries(LEVELS.map(l => [l.id, kanji.filter(x => levelOf(x) === l.id).length]));
  $('levels').innerHTML = [{ id: 'all', name: 'All' }, ...LEVELS].map(l => `<button type="button" data-filter="${l.id}" class="${levelFilter === l.id ? 'on' : ''}">
    ${l.id === 'all' ? '' : `<span class="dot" style="background:var(--${l.id})"></span>`}${l.name} <span class="muted">${l.id === 'all' ? kanji.length : counts[l.id]}</span></button>`).join('');
  const shown = visibleKanji();
  $('grid').innerHTML = shown.length ? shown.map(x => `
    <div class="kbox ${levelOf(x)}" data-k="${esc(x.k)}" title="${LEVELS.find(l => l.id === levelOf(x)).name}">
      <div class="r" lang="ja">${esc(x.reading)}</div>
      <div class="k" lang="ja">${esc(x.k)}</div>
      <div class="m">${esc(x.meaning)}</div>
    </div>`).join('')
    : `<div class="empty">${kanji.length ? 'No kanji match.' : 'No kanji yet.'}</div>`;
  renderCoverage();
}

// How many of the kanji in your vocab you know, and which unknown ones show up most
function renderCoverage() {
  const cov = kanjiCoverage(vocab, kanji);
  $('cov-card').hidden = !cov.total;
  if (!cov.total) return;
  const pct = Math.round(cov.known / cov.total * 100);
  $('cov').innerHTML = `
    <div class="muted" style="font-size:14px">Your vocab uses <b style="color:var(--ink)">${cov.total}</b> different kanji — you know <b style="color:var(--ink)">${cov.known}</b> of them (${pct}%).</div>
    <div class="cov-bar"><div style="width:${pct}%"></div></div>
    ${cov.next.length ? `<div class="d-h">Learn next — most used in your vocab</div>
    <div class="chips">${cov.next.slice(0, 24).map(n => `<button type="button" class="chip" data-k="${esc(n.char)}" title="Used in ${n.words.length} word${n.words.length === 1 ? '' : 's'}">
      <span class="c" lang="ja">${esc(n.char)}</span><small>×${n.words.length}</small></button>`).join('')}</div>` : '<div class="muted">You know every kanji in your vocab.</div>'}`;
}

// Popup for a kanji — known (reading, meaning) or not yet — with the vocab words that use it
function showKanji(char) {
  const x = kanji.find(y => y.k === char);
  const words = wordsUsing(char, vocab);
  $('d-body').innerHTML = `
    <div class="d-k" lang="ja">${esc(char)}</div>
    ${x ? `<div class="d-r" lang="ja">${esc(x.reading)}</div><div class="d-m">${esc(x.meaning)}</div>
      ${x.parts || x.story ? `<div class="d-story">${x.parts ? `<div class="parts" lang="ja">${esc(x.parts)}</div>` : ''}${esc(x.story)}</div>` : ''}`
        : '<div class="d-m muted" style="font-weight:400">Not in your kanji list yet</div>'}
    ${x && token ? `<div class="d-h">How well do you know it?</div>
      <div class="rate">${LEVELS.map(l => `<button type="button" data-level="${l.id}" class="${levelOf(x) === l.id ? 'on' : ''}">${l.name}</button>`).join('')}</div>`
      : x ? `<span class="lvl-tag" style="color:var(--${levelOf(x)})">${LEVELS.find(l => l.id === levelOf(x)).name}</span>` : ''}
    <div class="d-h">In your vocab</div>
    <div class="d-words">${words.length ? words.map(v => `<a href="vocab.html#${encodeURIComponent(v.id)}">
        <span class="dw" lang="ja">${esc(v.word)}</span><span class="dk" lang="ja">${esc(v.kana)}</span><span class="dm">${esc(v.meaning)}</span></a>`).join('')
      : '<div class="muted" style="padding:6px 0;font-size:14px">None of your vocab words use this yet.</div>'}</div>
    ${x && token ? `<div class="d-meta"><button type="button" class="link" data-rm="${esc(char)}">remove from kanji list</button></div>` : ''}`;
  if (!$('detail').open) $('detail').showModal();
}

async function save(mutate, message, okMsg) {
  if (!token) { toast('Sign in to edit'); return false; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    kanji = await ghWrite(FILE, list => mutate(list) ?? list, message, token, { empty: [] });
    toast(typeof okMsg === 'function' ? okMsg() : okMsg); return true;
  } catch (e) { toast(e.message); return false; }
  finally { document.querySelectorAll('button').forEach(b => b.disabled = false); render(); }
}

$('q').addEventListener('input', render);
$('levels').addEventListener('click', ev => {
  const f = ev.target.closest('button')?.dataset.filter;
  if (f) { levelFilter = f; render(); }
});
$('grid').addEventListener('click', ev => {
  const box = ev.target.closest('.kbox');
  if (box) showKanji(box.dataset.k);
});
$('cov').addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if (chip) showKanji(chip.dataset.k);
});
$('d-close').addEventListener('click', () => $('detail').close());
$('detail').addEventListener('click', async ev => {
  if (ev.target === $('detail')) return $('detail').close();   // clicked the backdrop
  const level = ev.target.dataset.level;
  if (level) return rate($('d-body').querySelector('.d-k').textContent, level);
  const rm = ev.target.dataset.rm;
  if (rm && confirm(`Remove ${rm} from your kanji list?`)) {
    $('detail').close();
    await save(list => list.filter(x => x.k !== rm), 'Remove kanji ' + rm, 'Removed ' + rm);
  }
});
// Set a rating: show it straight away, then save; put it back if the save fails
async function rate(char, level) {
  const x = kanji.find(y => y.k === char);
  if (!x || levelOf(x) === level) return;
  const before = x.level;
  x.level = level; render(); showKanji(char);
  const ok = await save(list => { const y = list.find(z => z.k === char); if (y) y.level = level; },
    `Rate ${char}: ${level}`, `${char} → ${LEVELS.find(l => l.id === level).name}`);
  if (!ok) { const y = kanji.find(z => z.k === char); if (y) y.level = before; render(); }
  if ($('detail').open) showKanji(char);
}

// --- Test: random kanji, no repeats in a session; timed mode reveals the answer after 5 seconds.
// After the answer you rate it Great / Neutral / Bad, which saves its level and moves on.
const TEST_SECONDS = 5;
let test = null;        // { mode: 'timed' | 'untimed', queue: [kanji], i, revealed, timer, rated }
let testPool = 'all';   // which kanji to test: 'all' or a level id
let rateChain = Promise.resolve();   // ratings save one after another in the background

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const poolKanji = pool => kanji.filter(x => pool === 'all' || levelOf(x) === pool);

function testSetup() {
  clearTimeout(test?.timer); test = null;
  if (testPool !== 'all' && !poolKanji(testPool).length) testPool = 'all';
  $('t-body').innerHTML = `
    <h2 style="margin:0">Test yourself</h2>
    <div class="muted" style="font-size:14px">A random kanji each time, no repeats. Rate each one to update its level.</div>
    <div class="d-h" style="margin-top:16px">Which kanji</div>
    <div class="levels" style="justify-content:center">${[{ id: 'all', name: 'All' }, ...LEVELS].map(l => {
      const n = poolKanji(l.id).length;
      return `<button type="button" data-pool="${l.id}" class="${testPool === l.id ? 'on' : ''}"${n ? '' : ' disabled'}>
        ${l.id === 'all' ? '' : `<span class="dot" style="background:var(--${l.id})"></span>`}${l.name} <span class="muted">${n}</span></button>`;
    }).join('')}</div>
    <div class="t-modes">
      <button type="button" data-mode="untimed"><b>Untimed</b><small>Reveal when you're ready</small></button>
      <button type="button" data-mode="timed"><b>Timed</b><small>${TEST_SECONDS} seconds each</small></button>
    </div>
    ${token ? '' : '<div class="muted" style="font-size:13px">Not signed in, so ratings won\'t be saved.</div>'}`;
  if (!$('test').open) $('test').showModal();
}

function testStart(mode) {
  const pool = poolKanji(testPool);
  if (!pool.length) return toast('No kanji in that group');
  test = { mode, queue: shuffle([...pool]), i: 0, revealed: false, timer: null, rated: 0 };
  testShow();
}

function testShow() {
  clearTimeout(test.timer);
  const x = test.queue[test.i];
  test.revealed = false;
  $('t-body').innerHTML = `
    <div class="t-top"><span>${test.i + 1} / ${test.queue.length}</span><span>${test.mode === 'timed' ? `${TEST_SECONDS}s` : 'Untimed'}</span></div>
    ${test.mode === 'timed' ? '<div class="t-bar"><div id="t-bar"></div></div>' : ''}
    <div class="t-k" lang="ja">${esc(x.k)}</div>
    <div class="t-ans" id="t-ans"></div>
    <div class="t-btns" id="t-btns">
      <button type="button" data-t="end">End</button>
      ${test.mode === 'untimed' ? '<button type="button" class="primary" data-t="reveal" id="t-main">Show answer</button>' : ''}
    </div>`;
  if (test.mode === 'timed') {
    const bar = $('t-bar');
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${TEST_SECONDS}s linear`; bar.style.width = '0'; }));
    const t = test;
    test.timer = setTimeout(() => { if (test === t) testReveal(); }, TEST_SECONDS * 1000);
  }
  // untimed: Space / Enter on the focused button shows the answer; timed: nothing to press until it reveals
  if (test.mode === 'untimed') $('t-main').focus(); else document.activeElement?.blur();
}

function testReveal() {
  if (!test || test.revealed) return;
  clearTimeout(test.timer);
  const x = test.queue[test.i];
  test.revealed = true;
  $('t-ans').innerHTML = `<div class="r" lang="ja">${esc(x.reading)}</div><div class="m">${esc(x.meaning)}</div>`;
  $('t-btns').innerHTML = `
    <button type="button" data-t="end">End</button>
    <div class="rate" style="margin:0">${LEVELS.map((l, n) => `<button type="button" data-rate="${l.id}" class="${levelOf(x) === l.id ? 'now' : ''}" title="Key ${n + 1}">${l.name}</button>`).join('')}</div>`;
  document.activeElement?.blur();
}

// Rate the current kanji, save it in the background, and go to the next one
function testRate(level) {
  if (!test || !test.revealed) return;
  const x = test.queue[test.i];
  test.rated++;
  if (levelOf(x) !== level) {
    x.level = level; render();
    if (token) rateChain = rateChain
      .then(() => ghWrite(FILE, list => { const y = list.find(z => z.k === x.k); if (y) y.level = level; }, `Rate ${x.k}: ${level} (test)`, token, { empty: [] }))
      .catch(e => toast(`Couldn't save ${x.k}: ${e.message}`));
  }
  if (++test.i < test.queue.length) testShow(); else testEnd(true);
}

function testEnd(finished) {
  if (!test) return $('test').close();
  clearTimeout(test.timer);
  const { rated } = test, total = test.queue.length;
  test = null;
  const counts = LEVELS.map(l => `<span><span class="dot" style="background:var(--${l.id})"></span> ${l.name} ${poolKanji(l.id).length}</span>`).join(' &nbsp; ');
  $('t-body').innerHTML = `
    <h2 style="margin:0 0 6px">${finished ? 'That\'s all of them!' : 'Test ended'}</h2>
    <div class="muted" style="margin-bottom:6px">You rated <b style="color:var(--ink)">${rated}</b> of ${total} kanji.</div>
    <div class="muted" style="font-size:13px;margin-bottom:16px">Now: ${counts}</div>
    <div class="t-btns">
      <button type="button" data-t="close">Close</button>
      <button type="button" class="primary" data-t="again">Test again</button>
    </div>`;
}

$('test-open').addEventListener('click', testSetup);
$('t-close').addEventListener('click', () => $('test').close());
$('test').addEventListener('close', () => { clearTimeout(test?.timer); test = null; });
$('t-body').addEventListener('click', ev => {
  const pool = ev.target.closest('[data-pool]')?.dataset.pool;
  if (pool) { testPool = pool; return testSetup(); }
  const mode = ev.target.closest('[data-mode]')?.dataset.mode;
  if (mode) return testStart(mode);
  const level = ev.target.closest('[data-rate]')?.dataset.rate;
  if (level) return testRate(level);
  const act = ev.target.closest('[data-t]')?.dataset.t;
  if (act === 'reveal') testReveal();
  else if (act === 'end') testEnd(false);
  else if (act === 'again') testSetup();
  else if (act === 'close') $('test').close();
});
// Keys: Space / Enter shows the answer (untimed); 1 / 2 / 3 rate Great / Neutral / Bad
document.addEventListener('keydown', ev => {
  if (!test || !$('test').open || ev.target.closest('button')) return;
  const n = '123'.indexOf(ev.key);
  if (test.revealed && n >= 0) { ev.preventDefault(); return testRate(LEVELS[n].id); }
  if (!test.revealed && test.mode === 'untimed' && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); testReveal(); }
});

// kanji.html#日 opens that kanji (links from the vocab page)
const openFromHash = () => { const c = decodeURIComponent(location.hash.slice(1)); if (c) showKanji(c); };
window.addEventListener('hashchange', openFromHash);

// --- Owner sign-in (same token as the hours page) ---
function applyAuth() {
  document.querySelectorAll('.owner-only').forEach(el => el.hidden = !token);
  document.body.classList.toggle('owner', !!token);
  $('auth').textContent = token ? 'Sign out' : 'Sign in';
  render();
}
$('auth').addEventListener('click', () => {
  if (token) { token = null; store.del(TOKEN_KEY); applyAuth(); toast('Signed out'); }
  else { $('auth-card').hidden = false; $('token').focus(); }
});
$('auth-cancel').addEventListener('click', () => $('auth-card').hidden = true);
$('auth-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const t = $('token').value.trim();
  if (!await ghCanWrite(t)) return toast('That token can\'t write to ' + REPO);
  token = t; store.set(TOKEN_KEY, t);
  $('token').value = ''; $('auth-card').hidden = true;
  applyAuth(); toast('Signed in');
});

applyAuth();
Promise.all([ghRead(FILE, [], token), loadJson('vocab.json')])
  .then(([r, v]) => { kanji = r.data; vocab = v; render(); openFromHash(); $('status').textContent = 'Hover for the meaning, tap a kanji for the words that use it.'; })
  .catch(e => { $('status').textContent = 'Couldn\'t load kanji: ' + e.message; });
</script>
</body>
</html>
